name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt
      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match desktop/version.json' }
      - run: python -m pip install -r requirements-desktop-lock.txt
      - run: python -m unittest discover -s tests -p test_desktop.py -v
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
